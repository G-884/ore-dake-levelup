<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body style="margin:0">
<title>俺だけレベルアップ</title>
<style>
/* =========================================================================
 * 俺だけレベルアップ / style.css
 * ダーク基調・スマホ片手操作前提
 * ========================================================================= */

:root {
  --bg: #0a0d16;
  --bg-2: #0f1421;
  --panel: #161d2e;
  --panel-2: #1d2639;
  --panel-3: #262f45;
  --line: #2a3450;
  --line-soft: #202941;

  --text: #e8edf8;
  --text-2: #a4b0c8;
  --text-3: #6d7a95;

  --accent: #4dd9ff;
  --accent-2: #2f8fff;
  --accent-dim: rgba(77, 217, 255, 0.12);
  --gold: #ffc861;
  --danger: #ff5d6c;
  --ok: #3fd1a0;

  --str: #ff5d6c;
  --vit: #ffb648;
  --end: #3fd1a0;
  --agi: #4ea8ff;
  --dex: #b07cff;

  --radius: 14px;
  --radius-s: 10px;
  --nav-h: 60px;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
               "Noto Sans JP", "Yu Gothic UI", "Segoe UI", Meiryo, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background-image:
    radial-gradient(1000px 520px at 50% -180px, rgba(47, 143, 255, 0.18), transparent 70%),
    radial-gradient(600px 400px at 110% 10%, rgba(176, 124, 255, 0.10), transparent 70%);
  background-attachment: fixed;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}
button { cursor: pointer; }

/* ---------------- レイアウト ---------------- */
#app { display: flex; flex-direction: column; min-height: 100dvh; }

.appbar {
  position: sticky; top: 0; z-index: 30;
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, rgba(10,13,22,0.96), rgba(10,13,22,0.72));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-soft);
}
.appbar h1 {
  margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .04em;
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.appbar .lvchip {
  font-size: 12px; font-weight: 800; letter-spacing: .06em;
  padding: 4px 10px; border-radius: 999px;
  color: var(--gold); background: rgba(255, 200, 97, .10);
  border: 1px solid rgba(255, 200, 97, .28);
}
.appbar .barback {
  background: none; border: none; padding: 4px 6px 4px 0; color: var(--accent);
  font-size: 14px;
}

main {
  flex: 1;
  padding: 14px 14px calc(var(--nav-h) + var(--safe-bottom) + 92px);
  max-width: 720px; width: 100%; margin: 0 auto;
}

/* ---------------- カード ---------------- */
.card {
  background: linear-gradient(180deg, var(--panel), var(--bg-2));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card.tight { padding: 12px; }
.card-title {
  font-size: 12px; font-weight: 700; letter-spacing: .12em;
  color: var(--text-3); text-transform: uppercase; margin: 0 0 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.section-title {
  font-size: 13px; font-weight: 700; color: var(--text-2);
  margin: 18px 2px 8px; letter-spacing: .06em;
}

/* ---------------- ホーム: レベル ---------------- */
.hero { text-align: center; padding: 20px 16px 18px; }
.hero .lv-label { font-size: 11px; letter-spacing: .3em; color: var(--text-3); }
.hero .lv-value {
  font-size: 62px; font-weight: 900; line-height: 1; letter-spacing: -.02em;
  background: linear-gradient(180deg, #fff, var(--accent));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 40px rgba(77, 217, 255, .25);
  font-variant-numeric: tabular-nums;
}
.hero .lv-value small { font-size: 22px; font-weight: 800; }
.hero .exp-text {
  margin-top: 10px; font-size: 13px; color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.hero .exp-text b { color: var(--text); }

.expbar {
  height: 10px; border-radius: 999px; background: var(--panel-3);
  overflow: hidden; margin-top: 8px; border: 1px solid var(--line);
}
.expbar > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  box-shadow: 0 0 14px rgba(77, 217, 255, .55);
  transition: width .6s cubic-bezier(.2,.8,.2,1);
}

/* ---------------- ステータス ---------------- */
.stats { display: flex; flex-direction: column; gap: 10px; }
.stat-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.stat-name { font-size: 12px; font-weight: 800; letter-spacing: .08em; width: 84px; color: var(--text-2); }
.stat-name .ja { display: block; font-size: 10px; font-weight: 600; color: var(--text-3); letter-spacing: .02em; }
.stat-bar { height: 8px; border-radius: 999px; background: var(--panel-3); overflow: hidden; }
.stat-bar > i { display: block; height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.stat-val { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }

.stat-STR .stat-bar > i, .dot-STR { background: var(--str); }
.stat-VIT .stat-bar > i, .dot-VIT { background: var(--vit); }
.stat-END .stat-bar > i, .dot-END { background: var(--end); }
.stat-AGI .stat-bar > i, .dot-AGI { background: var(--agi); }
.stat-DEX .stat-bar > i, .dot-DEX { background: var(--dex); }
.stat-STR .stat-val { color: var(--str); }
.stat-VIT .stat-val { color: var(--vit); }
.stat-END .stat-val { color: var(--end); }
.stat-AGI .stat-val { color: var(--agi); }
.stat-DEX .stat-val { color: var(--dex); }

/* 大きいステータス表示（ステータス画面） */
.stat-big { margin-bottom: 18px; }
.stat-big .top { display: flex; align-items: baseline; justify-content: space-between; }
.stat-big .nm { font-size: 15px; font-weight: 800; letter-spacing: .1em; }
.stat-big .nm span { font-size: 11px; color: var(--text-3); margin-left: 8px; letter-spacing: 0; }
.stat-big .vl { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat-big .stat-bar { height: 12px; margin-top: 6px; }
.stat-big .sub { font-size: 11px; color: var(--text-3); margin-top: 5px; }

/* ---------------- 指標行 ---------------- */
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.metric {
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--radius-s); padding: 10px 8px; text-align: center;
}
.metric .v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.metric .k { font-size: 10px; color: var(--text-3); letter-spacing: .08em; margin-top: 2px; }
.metric.flame .v { color: var(--gold); }

/* ---------------- ボタン ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
  border-radius: var(--radius-s); padding: 12px 16px; font-weight: 700; font-size: 14px;
  transition: transform .08s ease, background .15s ease;
}
.btn:active { transform: scale(.97); }
.btn.block { width: 100%; }
.btn.primary {
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  border-color: transparent; color: #05121c;
  box-shadow: 0 6px 22px rgba(47, 143, 255, .35);
}
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: rgba(255,93,108,.35); background: rgba(255,93,108,.08); }
.btn.small { padding: 8px 12px; font-size: 13px; border-radius: 8px; }
.btn.big { padding: 18px; font-size: 17px; border-radius: var(--radius); }
.btn[disabled] { opacity: .45; pointer-events: none; }

.btn-row { display: flex; gap: 8px; }
.btn-row > * { flex: 1; }

/* 記録するボタン（ホーム） */
.record-cta {
  position: relative; width: 100%; padding: 20px; font-size: 19px; font-weight: 900;
  letter-spacing: .08em; border-radius: 18px; border: none; color: #05121c;
  background: linear-gradient(135deg, #7ef0ff, var(--accent) 40%, var(--accent-2));
  box-shadow: 0 10px 30px rgba(47, 143, 255, .4);
}
.record-cta:active { transform: scale(.98); }

/* FAB */
.fab {
  position: fixed; right: 16px; z-index: 40;
  bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
  width: 58px; height: 58px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, #7ef0ff, var(--accent-2));
  color: #05121c; font-size: 28px; font-weight: 800; line-height: 1;
  box-shadow: 0 8px 26px rgba(47, 143, 255, .45);
  display: flex; align-items: center; justify-content: center;
}
.fab:active { transform: scale(.94); }

/* ---------------- ボトムナビ ---------------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  display: flex;
  background: rgba(11, 15, 25, .92);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line-soft);
}
.tabbar button {
  flex: 1; background: none; border: none; color: var(--text-3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 0;
}
.tabbar button .ic { font-size: 19px; line-height: 1; }
.tabbar button.active { color: var(--accent); }

/* ---------------- リスト ---------------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 12px;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--radius-s); padding: 12px;
  text-align: left; width: 100%;
}
.row .icon {
  width: 36px; height: 36px; flex: 0 0 36px; border-radius: 10px;
  background: var(--panel-3); display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.row .body { flex: 1; min-width: 0; }
.row .body .t { font-weight: 700; font-size: 14px; }
.row .body .s { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.row .end { text-align: right; font-variant-numeric: tabular-nums; }
.row .end .exp { font-size: 14px; font-weight: 800; color: var(--accent); }
.row .end .sub { font-size: 10px; color: var(--text-3); }
.row.tappable:active { background: var(--panel-3); }

.chip {
  display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .06em;
  padding: 2px 7px; border-radius: 999px; margin-left: 6px;
  background: rgba(255, 200, 97, .14); color: var(--gold); border: 1px solid rgba(255,200,97,.3);
}

.empty {
  text-align: center; color: var(--text-3); font-size: 13px; padding: 28px 12px;
  border: 1px dashed var(--line); border-radius: var(--radius);
}

/* ---------------- 種目選択グリッド ---------------- */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.act-tile {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 10px; text-align: center; display: flex; flex-direction: column;
  align-items: center; gap: 6px;
}
.act-tile:active { background: var(--panel-3); transform: scale(.97); }
.act-tile .em { font-size: 26px; line-height: 1; }
.act-tile .nm { font-size: 13px; font-weight: 700; }
.act-tile .pb { font-size: 10px; color: var(--text-3); }
.act-tile.selected { border-color: var(--accent); background: var(--accent-dim); }

/* ---------------- フォーム ---------------- */
.field { margin-bottom: 14px; }
.field > label {
  display: block; font-size: 12px; font-weight: 700; color: var(--text-2);
  margin-bottom: 6px; letter-spacing: .04em;
}
.hint { font-size: 11px; color: var(--text-3); margin-top: 5px; line-height: 1.6; }
input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
  width: 100%; padding: 13px 12px; border-radius: var(--radius-s);
  border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
  font-size: 16px; /* iOSで自動ズームさせない */
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); background: var(--panel-3); }
input[type="number"] { font-variant-numeric: tabular-nums; font-weight: 700; }
textarea { min-height: 72px; resize: vertical; font-size: 15px; }
select {
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%),
                    linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
.inline-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.inline-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.unit-suffix { position: relative; }
.unit-suffix > span {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 13px; color: var(--text-3); pointer-events: none; font-weight: 600;
}
.unit-suffix input { padding-right: 44px; }

.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.quick button {
  background: var(--panel-3); border: 1px solid var(--line); color: var(--text-2);
  border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 700;
}
.quick button:active { background: var(--accent-dim); color: var(--accent); }

.switch-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--line-soft);
}
.switch-row:last-child { border-bottom: none; }
.switch-row .lb { font-size: 14px; font-weight: 600; }
.switch-row .sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.switch-row .ctl { flex: 0 0 auto; }
.switch-row .ctl input[type="number"] { width: 96px; text-align: right; }
.switch-row .ctl select { width: auto; min-width: 120px; }

.toggle { position: relative; width: 50px; height: 29px; flex: 0 0 50px; }
.toggle input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; z-index: 2; }
.toggle .track {
  position: absolute; inset: 0; border-radius: 999px; background: var(--panel-3);
  border: 1px solid var(--line); transition: background .2s;
}
.toggle .knob {
  position: absolute; top: 3px; left: 3px; width: 23px; height: 23px; border-radius: 50%;
  background: var(--text-3); transition: transform .2s, background .2s;
}
.toggle input:checked ~ .track { background: rgba(77,217,255,.25); border-color: var(--accent); }
.toggle input:checked ~ .knob { transform: translateX(21px); background: var(--accent); }

/* ---------------- カレンダー ---------------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head .m { font-size: 16px; font-weight: 800; letter-spacing: .04em; }
.cal-head button { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; width: 36px; height: 32px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { font-size: 10px; text-align: center; color: var(--text-3); padding: 2px 0; font-weight: 700; }
.cal-dow.sun { color: #ff8a95; } .cal-dow.sat { color: #7fb6ff; }
.cal-cell {
  aspect-ratio: 1 / 1; border-radius: 9px; background: var(--panel-2);
  border: 1px solid var(--line-soft); display: flex; flex-direction: column;
  align-items: center; justify-content: center; font-size: 12px; color: var(--text-3);
  position: relative; padding: 0;
}
.cal-cell.blank { background: transparent; border-color: transparent; }
.cal-cell.has { color: #06131c; font-weight: 800; }
.cal-cell.lv1 { background: rgba(77,217,255,.30); border-color: rgba(77,217,255,.4); color: var(--text); }
.cal-cell.lv2 { background: rgba(77,217,255,.55); border-color: rgba(77,217,255,.6); color: #041420; }
.cal-cell.lv3 { background: linear-gradient(135deg, #7ef0ff, var(--accent-2)); border-color: transparent; color: #041420; }
.cal-cell.today { box-shadow: 0 0 0 2px var(--gold) inset; }
.cal-cell .cnt { position: absolute; bottom: 2px; font-size: 8px; opacity: .8; }
.cal-legend { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-top: 8px; font-size: 10px; color: var(--text-3); }
.cal-legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

/* ---------------- グラフ ---------------- */
.chart { width: 100%; height: 180px; display: block; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--text-3); margin-top: 6px; }

/* ---------------- モーダル / シート ---------------- */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 60; background: rgba(4, 7, 14, .72);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadein .18s ease;
}
.sheet {
  width: 100%; max-width: 720px; max-height: 92dvh; overflow-y: auto;
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 20px 20px 0 0; padding: 8px 16px calc(24px + var(--safe-bottom));
  animation: slideup .24s cubic-bezier(.2,.9,.3,1);
  -webkit-overflow-scrolling: touch;
}
.sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 14px; }
.sheet h2 { margin: 0 0 14px; font-size: 17px; font-weight: 800; }
.sheet .sheet-actions { display: flex; gap: 8px; margin-top: 18px; }
.sheet .sheet-actions > * { flex: 1; }

@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideup { from { transform: translateY(22px); opacity: .6; } to { transform: none; opacity: 1; } }

/* ---------------- 記録結果オーバーレイ ---------------- */
.result-backdrop {
  position: fixed; inset: 0; z-index: 70; background: rgba(4, 7, 14, .86);
  display: flex; align-items: center; justify-content: center; padding: 24px;
  animation: fadein .2s ease;
}
.result {
  width: 100%; max-width: 380px; text-align: center;
  background: linear-gradient(180deg, var(--panel), var(--bg-2));
  border: 1px solid var(--line); border-radius: 20px; padding: 26px 20px 20px;
  animation: pop .3s cubic-bezier(.2,1.2,.4,1);
}
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
.result .exp {
  font-size: 46px; font-weight: 900; color: var(--accent); line-height: 1.05;
  text-shadow: 0 0 30px rgba(77,217,255,.45); font-variant-numeric: tabular-nums;
}
.result .exp small { font-size: 18px; margin-left: 4px; }
.result .actname { font-size: 13px; color: var(--text-2); }
.result .growths { margin: 16px 0 4px; display: flex; flex-direction: column; gap: 5px; }
.result .growths div { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
.result .banner {
  margin: 14px 0 0; padding: 11px; border-radius: 12px; font-weight: 900; letter-spacing: .08em;
}
.result .banner.pb { background: linear-gradient(135deg, rgba(255,200,97,.22), rgba(255,200,97,.08)); color: var(--gold); border: 1px solid rgba(255,200,97,.4); }
.result .banner.lvup { background: linear-gradient(135deg, rgba(77,217,255,.25), rgba(47,143,255,.1)); color: var(--accent); border: 1px solid rgba(77,217,255,.45); }
.result .streak { margin-top: 12px; font-size: 14px; color: var(--gold); font-weight: 800; }
.result .bonus-note { font-size: 11px; color: var(--text-3); margin-top: 8px; }

/* ---------------- トースト ---------------- */
#toast-host {
  position: fixed; left: 0; right: 0; z-index: 90; display: flex; flex-direction: column;
  align-items: center; gap: 8px; pointer-events: none;
  bottom: calc(var(--nav-h) + var(--safe-bottom) + 84px);
}
.toast {
  background: var(--panel-3); color: var(--text); border: 1px solid var(--line);
  border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 700;
  max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  animation: toastin .2s ease;
}
.toast.err { border-color: rgba(255,93,108,.5); color: #ffc0c6; background: rgba(60, 20, 26, .96); }
.toast.ok { border-color: rgba(63,209,160,.45); color: #b6f2dd; }
@keyframes toastin { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------------- 起動エラー画面 ---------------- */
.boot-error { padding: 30px 20px; max-width: 560px; margin: 0 auto; }
.boot-error h2 { color: var(--danger); font-size: 18px; }
.boot-error p { color: var(--text-2); font-size: 14px; line-height: 1.7; }
.boot-error .note {

    var preview = UI.el('div', { class: 'card tight', style: { marginBottom: '0' } });
    content.push(preview);

    }

      content: content,
      actions: [
        { label: 'キャンセル' },

      var raw = collect();
      var input = {};
      fields.forEach(function (f) {

      if (!v.ok) {
        preview.appendChild(UI.el('div', { class: 'muted', text: '数値を入力すると獲得EXPの目安が表示されます。' }));

      }

      var date = dateInput.value || U.today();
      var pseudo = { id: editing ? editing.id : null, date: date, createdAt: editing ? editing.createdAt : U.nowIso() };
      var withoutSelf = editing
        ? data.trainingRecords.filter(function (r) { return r.id !== editing.id; })
        : data.trainingRecords;

      var backup = data.trainingRecords;
      data.trainingRecords = withoutSelf;

      try {
        snap = G.snapshotBefore(data, pseudo);
        built = G.buildRecord(data, { activityId: activityId, date: date, input: input }, snap);
      } catch (e) {
        data.trainingRecords = backup;
        preview.appendChild(UI.el('div', { class: 'muted', text: '計算できませんでした。' }));

        UI.kv('負荷 Load', U.fmt(built.load, 1)),

        rows.push(UI.kv('PBボーナス', '<span style="color:var(--gold)">+' + Math.round(built.expBreakdown.pbRate * 100) + '%  🎉 ' + U.escapeHtml(hitNames) + '</span>'));

      }

        .map(function (s) { return s + ' +' + U.fmt(built.statGrowth[s], 2); }).join('  ');

      var raw = collect();
      var input = {};
      fields.forEach(function (f) {

      var date = dateInput.value;
      if (!U.isDateStr(date)) { UI.toast('日付を選んでください', 'err'); return; }

      var params = { activityId: activityId, date: date, input: input, note: noteInput.value.trim() };
      var res = editing ? Repo.updateTrainingRecord(editing.id, params) : Repo.addTrainingRecord(params);

      if (!res.ok) {
        UI.toast(res.errors[0], 'err', 3200);
        return;
      }
      if (res.saveResult && !res.saveResult.ok) {
        UI.toast(saveErrorMessage(res.saveResult.error), 'err', 5000);
      }

      api.close();
      if (editing) {
        UI.toast('記録を更新しました', 'ok');
        if (typeof options.onSaved === 'function') options.onSaved(res);
        ODL.App.refresh();
      } else {

        showResult(res, master);
        if (typeof options.onSaved === 'function') options.onSaved(res);
      }
    }

    if (rec.expBreakdown.pbRate > 0) notes.push('PB +' + Math.round(rec.expBreakdown.pbRate * 100) + '%');

/* =========================================================================
 * 俺だけレベルアップ / ui/history.js
 * カレンダー・履歴一覧・記録の詳細／編集／削除
 * ========================================================================= */
(function (global) {
  'use strict';
  var ODL = global.ODL || (global.ODL = {});
  var U = ODL.Utils;
  var C = ODL.Calculator;
  var G = ODL.GameState;
  var Repo = ODL.Repository;
  var UI = ODL.UI;

  UI.views = UI.views || {};

  var viewState = {
    month: null,            /* 'YYYY-MM' */

  UI.views.history = function () {
    var data = Repo.data;
    var st = Repo.state();
    var root = UI.el('div');

    if (!viewState.month) viewState.month = U.monthKey(U.today());

    /* ---------------- カレンダー ---------------- */
    root.appendChild(UI.card(null, buildCalendar(st), { tight: true }));

    /* ---------------- 選択日 or 全履歴 ---------------- */
    if (viewState.selectedDate) {
      var day = data.trainingRecords.filter(function (r) { return r.date === viewState.selectedDate; });
      root.appendChild(UI.el('div', { class: 'section-title' }, [
        U.formatDateFull(viewState.selectedDate),
        UI.el('button', {
          class: 'btn small ghost', style: { float: 'right', marginTop: '-6px' },
          text: '選択解除', onclick: function () { viewState.selectedDate = null; ODL.App.refresh(); }
        })
      ]));
      if (day.length) {
        root.appendChild(UI.el('div', { class: 'list' },
          G.sortRecords(day).map(function (r) { return UI.recordRow(r, data); })));
        var dayExp = U.sum(day, function (r) { return r.exp; });
        root.appendChild(UI.el('div', { class: 'muted right mt8', text: 'この日の合計 +' + U.fmtInt(dayExp) + ' EXP' }));
      } else {
        root.appendChild(UI.empty('この日は記録がありません'));
      }
      root.appendChild(UI.el('button', {
        class: 'btn block mt16', text: 'この日に記録を追加',
        onclick: function () { UI.openRecordSheet({ date: viewState.selectedDate }); }
      }));
      return root;
    }

    /* フィルタ */
    var select = UI.el('select', {
      onchange: function () { viewState.filterActivity = select.value; viewState.limit = 40; ODL.App.refresh(); }
    }, [UI.el('option', { value: 'all', text: 'すべての種目' })].concat(
      data.activityMasters.map(function (m) {
        return UI.el('option', { value: m.activityId, text: m.name });
      })
    ));
    select.value = viewState.filterActivity;
    root.appendChild(UI.el('div', { class: 'field mt16' }, [select]));

    var list = data.trainingRecords.slice();
    if (viewState.filterActivity !== 'all') {
      list = list.filter(function (r) { return r.activityId === viewState.filterActivity; });
    }
    list = G.sortRecords(list).reverse();

    if (!list.length) {
      root.appendChild(UI.empty('記録がありません'));
      return root;
    }

    var shown = list.slice(0, viewState.limit);
    var byDate = {};
    var order = [];
    shown.forEach(function (r) {
      if (!byDate[r.date]) { byDate[r.date] = []; order.push(r.date); }
      byDate[r.date].push(r);
    });

    order.forEach(function (date) {
      var recs = byDate[date];
      var exp = U.sum(recs, function (r) { return r.exp; });
      root.appendChild(UI.el('div', { class: 'section-title' }, [

      ]));
      root.appendChild(UI.el('div', { class: 'list' }, recs.map(function (r) {
        return UI.recordRow(r, data);
      })));
    });

    if (list.length > viewState.limit) {

        class: 'btn block ghost mt16', text: 'さらに表示（残り ' + (list.length - viewState.limit) + '件）',

    var head = UI.el('div', { class: 'cal-head' }, [
      UI.el('button', { text: '‹', onclick: function () { shiftMonth(-1); } }),

    var grid = UI.el('div', { class: 'cal-grid' });

    });

    var first = new Date(year, month - 1, 1);
    var startDow = first.getDay();
    var daysInMonth = new Date(year, month, 0).getDate();
    var today = U.today();

    for (var i = 0; i < startDow; i++) grid.appendChild(UI.el('div', { class: 'cal-cell blank' }));

    for (var d = 1; d <= daysInMonth; d++) {
      (function (day) {

        var count = st.dateCounts[ds] || 0;
        var cls = 'cal-cell';
        if (count >= 3) cls += ' has lv3';
        else if (count === 2) cls += ' has lv2';
        else if (count === 1) cls += ' has lv1';
        if (ds === today) cls += ' today';
        var cell = UI.el('button', {

          count > 0 ? UI.el('span', { class: 'cnt', text: count + '件' }) : null

  UI.openRecordDetail = function (record) {

/* ===== js/ui/status.js ===== */
/* =========================================================================
 * 俺だけレベルアップ / ui/status.js

(function (global) {
  'use strict';
  var ODL = global.ODL || (global.ODL = {});

  UI.views.status = function () {
    var data = Repo.data;

    var s = data.settings;

    /* ---- Lv 概要 ---- */
    root.appendChild(UI.card('LEVEL', [
      UI.kv('レベル', 'Lv.' + st.level),
      UI.kv('累積EXP', U.fmtInt(st.cumulativeExp)),
      UI.kv('次のレベルまで', U.fmtInt(st.levelInfo.remaining) + ' EXP'),
      UI.kv('通算トレ日数', st.totalDays + ' 日'),
      UI.kv('通算記録数', st.totalRecords + ' 件'),
      UI.kv('最長ストリーク', st.streak.best + ' 日')
    ]));

    /* ---- 5ステータス ---- */
    var maxStat = Math.max(U.num(s.display.statBarMax, 60),
      Math.ceil(Math.max.apply(null, ODL.STATS.map(function (k) { return st.stats[k]; })) / 10) * 10);

    var growthSinceMonth = statsDelta(data, 30);

    var statCard = UI.el('div', { class: 'card' });
    statCard.appendChild(UI.el('div', { class: 'card-title', text: 'STATUS' }));
    ODL.STATS.forEach(function (k) {
      var v = st.stats[k];
      var pct = U.clamp((v / maxStat) * 100, 0, 100);
      var delta = growthSinceMonth[k];
      statCard.appendChild(UI.el('div', { class: 'stat-big stat-' + k }, [
        UI.el('div', { class: 'top' }, [
          UI.el('div', { class: 'nm', html: k + '<span>' + ODL.STAT_LABELS_LONG[k] + '</span>' }),
          UI.el('div', { class: 'vl', text: U.fmt(v, 1) })
        ]),
        UI.el('div', { class: 'stat-bar' }, [UI.el('i', { style: { width: pct + '%' } })]),
        UI.el('div', { class: 'sub', text: delta > 0 ? '直近30日: +' + U.fmt(delta, 2) : '直近30日: 変化なし' })
      ]));

    var series = buildGrowthSeries(data);

      root.appendChild(UI.card('成長の推移', [
        UI.lineChart(series.series, {}),
        UI.el('div', { class: 'chart-legend' }, ODL.STATS.map(function (k) {
          return UI.el('span', {}, [
            UI.el('i', { class: 'dot-' + k, style: { display: 'inline-block', width: '9px', height: '9px', borderRadius: '2px', marginRight: '4px' } }),
            UI.el('span', { text: k })

    var pbRows = [];
    data.activityMasters.slice().sort(function (a, b) { return a.sortOrder - b.sortOrder; }).forEach(function (m) {
      var pb = st.pbs[m.activityId];
      if (!pb) return;
      var metrics = Object.keys(pb.metrics || {}).map(function (k) { return pb.metrics[k]; });
      if (!metrics.length) metrics = [{ label: '記録', text: pb.label, date: pb.date }];

      if (metrics.length === 1) {
        pbRows.push(UI.el('div', { class: 'row' }, [
          UI.el('div', { class: 'icon', text: m.icon || '🏋️' }),
          UI.el('div', { class: 'body' }, [
            UI.el('div', { class: 't', text: m.name }),
            UI.el('div', { class: 's', text: U.formatDateJa(metrics[0].date, true) })
          ]),
          UI.el('div', { class: 'end' }, [
            UI.el('div', { class: 'exp', style: { color: 'var(--gold)' }, text: metrics[0].text })
          ])
        ]));

      }

      /* 指標が複数ある種目（ランニングなど）は縦に並べる */
      pbRows.push(UI.el('div', { class: 'row', style: { alignItems: 'flex-start' } }, [
        UI.el('div', { class: 'icon', text: m.icon || '🏋️' }),
        UI.el('div', { class: 'body' }, [
          UI.el('div', { class: 't', text: m.name }),
          UI.el('div', { style: { marginTop: '4px' } }, metrics.map(function (mm) {
            return UI.el('div', {
              style: { display: 'flex', justifyContent: 'space-between', gap: '10px', fontSize: '12px', padding: '2px 0' }
            }, [
              UI.el('span', { style: { color: 'var(--text-3)' }, text: mm.label }),
              UI.el('span', {}, [
                UI.el('b', { style: { color: 'var(--gold)' }, text: mm.text }),
                UI.el('span', { style: { color: 'var(--text-3)', marginLeft: '8px' }, text: U.formatDateJa(mm.date) })
              ])

      pbRows.length ? UI.el('div', { class: 'list' }, pbRows) : UI.empty('まだ記録がありません')));

    /* ---- 種目別集計 ---- */
    var byAct = U.groupBy(data.trainingRecords, function (r) { return r.activityId; });
    var actRows = [];
    data.activityMasters.slice().sort(function (a, b) { return a.sortOrder - b.sortOrder; }).forEach(function (m) {
      var list = byAct[m.activityId];
      if (!list || !list.length) return;
      var exp = U.sum(list, function (r) { return r.exp; });
      var total = totalAmount(m, list);
      actRows.push(UI.el('div', { class: 'row' }, [
        UI.el('div', { class: 'icon', text: m.icon || '🏋️' }),
        UI.el('div', { class: 'body' }, [
          UI.el('div', { class: 't', text: m.name }),
          UI.el('div', { class: 's', text: list.length + '回 ・ 累計 ' + total })
        ]),
        UI.el('div', { class: 'end' }, [
          UI.el('div', { class: 'exp', text: '+' + U.fmtInt(exp) }),
          UI.el('div', { class: 'sub', text: 'EXP' })
        ])
      ]));
    });
    if (actRows.length) {
      root.appendChild(UI.card('種目別の積み上げ', UI.el('div', { class: 'list' }, actRows)));
    }

    return root;
  };

  function totalAmount(master, list) {
    switch (master.inputType) {
      case 'reps':
        return U.fmtInt(U.sum(list, function (r) { return U.num(r.input.reps, 0); })) + '回';
      case 'weight_reps':
        return U.fmtInt(U.sum(list, function (r) { return U.num(r.input.reps, 0); })) + '回';
      case 'minutes':
        return U.fmtInt(U.sum(list, function (r) { return U.num(r.input.minutes, 0); })) + '分';
      case 'distance_time':
        return U.fmt(U.sum(list, function (r) { return U.num(r.input.distance, 0); }), 1) + 'km';
      default:
        return '';
    }
  }

  /* 直近n日のステータス増分 */
  function statsDelta(data, days) {
    var since = U.addDays(U.today(), -days);
    var out = U.zeroStats();
    (data.trainingRecords || []).forEach(function (r) {
      if (U.diffDays(since, r.date) < 0) return;
      ODL.STATS.forEach(function (s) { out[s] += U.num(r.statGrowth[s], 0); });
    });
    return out;
  }

  /* 月ごとのステータス推移 */
  function buildGrowthSeries(data) {
    var sorted = G.sortRecords(data.trainingRecords);
    var labels = [];
    var points = {};
    ODL.STATS.forEach(function (s) { points[s] = []; });

    if (!sorted.length) return { labels: [], series: [] };

    var init = U.num(data.settings.growth.initialStat, 10);
    var cur = {};
    ODL.STATS.forEach(function (s) { cur[s] = init; });

    var monthMap = {};
    sorted.forEach(function (r) {
      ODL.STATS.forEach(function (s) { cur[s] += U.num(r.statGrowth[s], 0); });
      monthMap[U.monthKey(r.date)] = U.clone(cur);
    });

    var months = Object.keys(monthMap).sort();
    /* 表示は直近18ヶ月まで */
    months = months.slice(-18);
    months.forEach(function (m, i) {
      labels.push(m);
      ODL.STATS.forEach(function (s) { points[s].push({ x: i, y: monthMap[m][s] }); });
    });

    return {
      labels: labels,
      series: ODL.STATS.map(function (s) {
        return { name: s, color: ODL.STAT_COLORS[s], points: points[s] };
      })
    };
  }

(function (global) {

      .sort(function (a, b) { return a.sortOrder - b.sortOrder; });

      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;

    /* ---- 最新値 ---- */
    var latest = {};
    records.slice().reverse().forEach(function (r) {
      Object.keys(r.values).forEach(function (k) { latest[k] = { value: r.values[k], date: r.date }; });
    });

    var latestRows = metrics.filter(function (m) { return latest[m.metricId]; }).map(function (m) {

      return UI.el('div', { class: 'row' }, [
        UI.el('div', { class: 'body' }, [
          UI.el('div', { class: 't', text: m.name }),
          UI.el('div', { class: 's', text: U.formatDateJa(l.date) + (diffText ? ' ・ 前回比 ' + diffText : '') })
        ]),
        UI.el('div', { class: 'end' }, [
          UI.el('div', { class: 'exp', style: { color: 'var(--text)' }, text: U.fmt(l.value, 1) }),
          UI.el('div', { class: 'sub', text: m.unit })

    });

      class: 'btn primary block', text: '＋ 身体データを記録',
      onclick: function () { openBodySheet(null); }
    }));

    /* ---- 推移グラフ ---- */
    var chartable = metrics.filter(function (m) {
      return records.filter(function (r) { return r.values[m.metricId] !== undefined; }).length >= 2;
    });
    if (chartable.length) {
      if (!bodyState.chartMetric || !chartable.some(function (m) { return m.metricId === bodyState.chartMetric; })) {
        /* 変化を見たいのはまず体重なので、あれば体重を初期表示にする */
        var pref = chartable.filter(function (m) { return m.metricId === 'weight'; })[0];
        bodyState.chartMetric = (pref || chartable[0]).metricId;
      }
      var sel = UI.el('select', {

      }, chartable.map(function (m) { return UI.el('option', { value: m.metricId, text: m.name }); }));
      sel.value = bodyState.chartMetric;

      var metric = chartable.filter(function (m) { return m.metricId === bodyState.chartMetric; })[0];
      var pts = records.filter(function (r) { return r.values[metric.metricId] !== undefined; })
        .map(function (r) { return { x: U.parseDate(r.date), y: r.values[metric.metricId] }; })
        .sort(function (a, b) { return a.x - b.x; });

      root.appendChild(UI.card('推移', [

  function exportBackup() {
    var text = Repo.exportString();

    if (ok) {
      Repo.markBackedUp();
      UI.toast('書き出しました: ' + name, 'ok', 3500);
      ODL.App.refresh();
    } else {
      /* ダウンロードできない環境向けのフォールバック */
      var ta = UI.el('textarea', { style: { minHeight: '180px', fontSize: '11px' } });
      ta.value = text;
      UI.sheet({
        title: 'バックアップ（コピーして保存してください）',
        content: [UI.el('div', { class: 'hint mb8', text: 'この端末ではファイル保存ができませんでした。下の内容をすべてコピーして、メモアプリ等に保存してください。' }), ta],
        actions: [{ label: '閉じる' }, {

            ta.select();

          }
        }]

    }
  }

  function importBackup() {
    var input = UI.el('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
    document.body.appendChild(input);
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      document.body.removeChild(input);
      if (!file) return;
      var reader = new FileReader();
      reader.onerror = function () { UI.toast('ファイルを読み込めませんでした', 'err'); };
      reader.onload = function () { doImport(String(reader.result)); };
      reader.readAsText(file);
    });
    input.click();
  }

  function doImport(text, allowEmpty) {
    /* 検証 → migration → 保存 まで importFromString が担当する。
       途中で失敗した場合は現在のデータに一切手を触れずに戻ってくる。 */
    var preview = Repo.importFromString(text, { allowEmpty: !!allowEmpty });
    if (!preview.ok) {
      if (preview.needsConfirmEmpty) {
        UI.confirm({
          title: '記録が0件です',
          message: 'このバックアップにはトレーニング記録が入っていません。それでも復元しますか？',
          okLabel: '復元する', danger: true
        }).then(function (ok) { if (ok) doImport(text, true); });
        return;
      }
      UI.sheet({
        title: '復元できませんでした',
        content: [
          UI.el('div', { class: 'warnbox' }, UI.el('ul', { class: 'errlist' },
            preview.errors.map(function (e) { return UI.el('li', { text: e }); }))),
          UI.el('div', { class: 'hint mt8', text: '現在のデータは変更していません。' })
        ],
        actions: [{ label: '閉じる' }]
      });
      return;
    }

    UI.toast('復元しました（記録 ' + preview.counts.training + '件）', 'ok', 3500);
    if (preview.migrated) {
      UI.toast('古い形式を自動変換しました（' + preview.steps.join(', ') + '）', 'ok', 4200);
    }
    ODL.App.refresh();
  }

      inputType: 'reps', unit: '回', loadCoefficient: 4.0, expCoefficient: 1.0,

    function syncUnit() {
      var defaults = { reps: '回', weight_reps: 'kg・回', minutes: '分', distance_time: 'km' };

    var expInput = UI.el('input', { type: 'number', step: '0.1', min: '0.01', value: m.expCoefficient, inputmode: 'decimal', oninput: updateFormula });
    var quickInput = UI.el('input', { type: 'text', value: (m.quickValues || []).join(', '), placeholder: '例）20, 50, 100' });
    var orderInput = UI.el('input', { type: 'number', step: '1', value: m.sortOrder, inputmode: 'numeric' });

    var allocInputs = {};
    var allocTotalEl = UI.el('div', { class: 'hint' });
    function updateAlloc() {
      var total = 0;
      ODL.STATS.forEach(function (k) { total += U.num(allocInputs[k].value, 0); });
      allocTotalEl.textContent = '合計 ' + U.fmt(total, 0) + '%' + (Math.abs(total - 100) > 0.01 ? '（100%でなくても自動で正規化されます）' : '');
    }
    var allocRows = ODL.STATS.map(function (k) {
      var input = UI.el('input', {
        type: 'number', step: '5', min: '0', max: '100', inputmode: 'numeric',
        value: U.num(m.statAllocation[k], 0), oninput: updateAlloc
      });
      allocInputs[k] = input;
      return UI.el('div', { class: 'switch-row' }, [
        UI.el('div', {}, [
          UI.el('div', { class: 'lb', style: { color: ODL.STAT_COLORS[k] }, text: k + ' ' + ODL.STAT_LABELS[k] })
        ]),
        UI.el('div', { class: 'ctl unit-suffix', style: { width: '110px' } }, [input, UI.el('span', { text: '%' })])
      ]);
    });

    var formulaEl = UI.el('div', { class: 'hint' });
    function updateFormula() {
      var lc = U.num(loadInput.value, 1);
      var t = typeSelect.value;
      var f = {
        reps: 'Load = ' + lc + ' × √(回数)',
        weight_reps: 'Load = ' + lc + ' × √(重量 × 回数)',
        minutes: 'Load = ' + lc + ' × √(分)',
        distance_time: 'Load = 距離 × ' + lc + ' × ペース補正'
      }[t];
      var samples = {
        reps: [[10, '10回'], [50, '50回'], [100, '100回']],
        weight_reps: [[null, '30kg×20回'], [null, '40kg×30回']],
        minutes: [[5, '5分'], [10, '10分'], [30, '30分']],
        distance_time: [[null, '3km(6分/km)'], [null, '5km(6分/km)'], [null, '10km(6分/km)']]
      }[t];
      var fake = { loadCoefficient: lc, inputType: t };
      var exs = [];
      if (t === 'reps') { [10, 50, 100].forEach(function (n) { exs.push(n + '回 → ' + U.fmt(C.calculateLoad(fake, { reps: n }, Repo.data.settings).load, 1)); }); }
      else if (t === 'weight_reps') { [[30, 20], [40, 30]].forEach(function (p) { exs.push(p[0] + 'kg×' + p[1] + '回 → ' + U.fmt(C.calculateLoad(fake, { weight: p[0], reps: p[1] }, Repo.data.settings).load, 1)); }); }
      else if (t === 'minutes') { [5, 10, 30].forEach(function (n) { exs.push(n + '分 → ' + U.fmt(C.calculateLoad(fake, { minutes: n }, Repo.data.settings).load, 1)); }); }
      else { [3, 5, 10].forEach(function (n) { exs.push(n + 'km → ' + U.fmt(C.calculateLoad(fake, { distance: n }, Repo.data.settings).load, 1)); }); }
      formulaEl.innerHTML = U.escapeHtml(f) + '<br>例: ' + U.escapeHtml(exs.join(' ／ '));
    }
    updateAlloc();
    updateFormula();

    var content = [
      UI.el('div', { class: 'inline-2' }, [
        UI.el('div', { class: 'field' }, [UI.el('label', { text: 'アイコン' }), iconInput]),
        UI.el('div', { class: 'field' }, [UI.el('label', { text: '並び順' }), orderInput])
      ]),
      UI.el('div', { class: 'field' }, [UI.el('label', { text: '種目名' }), nameInput]),
      UI.el('div', { class: 'field' }, [UI.el('label', { text: '入力方式' }), typeSelect]),
      UI.el('div', { class: 'inline-2' }, [
        UI.el('div', { class: 'field' }, [UI.el('label', { text: '単位' }), unitInput]),
        UI.el('div', { class: 'field' }, [UI.el('label', { text: 'カテゴリ' }), catSelect])
      ]),
      UI.el('div', { class: 'inline-2' }, [
        UI.el('div', { class: 'field' }, [UI.el('label', { text: '負荷係数' }), loadInput]),
        UI.el('div', { class: 'field' }, [UI.el('label', { text: 'EXP係数' }), expInput])
      ]),
      formulaEl,
      UI.el('div', { class: 'field mt16' }, [UI.el('label', { text: 'クイック入力（カンマ区切り）' }), quickInput]),
      UI.el('div', { class: 'section-title', text: 'ステータス配分' }),
      UI.el('div', {}, allocRows),
      allocTotalEl
    ];

    var actions = [{ label: 'キャンセル' }];
    if (!isNew) {
      actions.push({
        label: m.active ? '無効にする' : '有効にする', keepOpen: true,
        onClick: function (api) {
          Repo.setActivityActive(m.activityId, !m.active);
          api.close();
          UI.toast(m.active ? '無効にしました' : '有効にしました', 'ok');
          ODL.App.refresh();
        }
      });
    }
    actions.push({
      label: '保存', kind: 'primary', keepOpen: true, onClick: function (api) {
        var alloc = {};
        ODL.STATS.forEach(function (k) { alloc[k] = U.num(allocInputs[k].value, 0); });
        var payload = {
          activityId: m.activityId || U.slugId(nameInput.value || 'activity'),
          name: nameInput.value.trim(),
          shortName: nameInput.value.trim(),
          icon: iconInput.value.trim() || '🏋️',
          category: catSelect.value,
          inputType: typeSelect.value,
          unit: unitInput.value.trim(),
          loadCoefficient: U.num(loadInput.value, 0),
          expCoefficient: U.num(expInput.value, 0),
          statAllocation: alloc,
          quickValues: quickInput.value.split(',').map(function (v) { return U.num(v, 0); }).filter(function (v) { return v > 0; }),
          active: m.active !== false,
          sortOrder: U.num(orderInput.value, 100),
          builtIn: m.builtIn
        };
        var res = Repo.upsertActivityMaster(payload);
        if (!res.ok) {
          UI.sheet({ title: '保存できません', content: UI.el('ul', { class: 'errlist' },
            res.errors.map(function (e) { return UI.el('li', { text: e }); })), actions: [{ label: '閉じる' }] });
          return;
        }
        api.close();
        UI.toast('保存しました', 'ok');
        ODL.App.refresh();
      }
    });

    UI.sheet({ title: isNew ? '種目を追加' : '種目を編集', content: content, actions: actions });
  }

})(typeof window !== 'undefined' ? window : globalThis);

/* ===== js/app.js ===== */
/* =========================================================================
 * 俺だけレベルアップ / app.js
 * 画面の組み立て・ルーティング・起動処理・PWA登録
 * ========================================================================= */
(function (global) {
  'use strict';
  var ODL = global.ODL || (global.ODL = {});
  var U = ODL.Utils;
  var Repo = ODL.Repository;
  var UI = ODL.UI;

  var TABS = [
    { id: 'home',     label: 'ホーム',   icon: '🏠', title: '俺だけレベルアップ' },
    { id: 'history',  label: '履歴',     icon: '📅', title: '履歴・カレンダー' },
    { id: 'status',   label: 'ステータス', icon: '📊', title: 'ステータス' },
    { id: 'body',     label: '身体',     icon: '📏', title: '身体データ' },
    { id: 'settings', label: '設定',     icon: '⚙️', title: '設定' }
  ];

  var current = 'home';
  var mounted = false;

  var App = ODL.App = {

    boot: function () {
      var status = Repo.load();

      if (status.state === 'corrupt') { renderRecovery(status, 'corrupt'); return; }
      if (status.state === 'migration_failed') { renderRecovery(status, 'migration'); return; }

      renderShell();
      App.go('home');

      if (status.state === 'readonly') {
        UI.toast('データを保存できませんでした。ブラウザの設定をご確認ください。', 'err', 6000);
      }
      if (status.migrated) {
        UI.toast('データ形式を更新しました（' + status.steps.join(', ') + '）。記録はそのまま引き継がれています。', 'ok', 5000);
      }
      registerServiceWorker();

      /* ホーム画面のショートカットから起動された場合 */
      try {
        if (/[?&]action=record\b/.test(location.search)) {
          setTimeout(function () { UI.openRecordSheet({}); }, 320);
        }
      } catch (e) { /* noop */ }
    },

    go: function (tab) {
      if (!TABS.some(function (t) { return t.id === tab; })) tab = 'home';
      current = tab;
      App.refresh();
      try { window.scrollTo({ top: 0, behavior: 'instant' }); } catch (e) { window.scrollTo(0, 0); }
    },

    refresh: function () {
      if (!mounted) return;
      var main = document.getElementById('main');
      var view = UI.views[current];
      UI.clear(main);
      try {
        main.appendChild(view());
      } catch (e) {
        console.error(e);
        main.appendChild(UI.el('div', { class: 'warnbox', text: '画面の表示中に問題が発生しました。アプリを再読み込みしてください。記録は保存されています。' }));
      }

      var tabbar = document.getElementById('tabbar');
      Array.prototype.forEach.call(tabbar.children, function (btn) {
        btn.classList.toggle('active', btn.dataset.tab === current);
      });

      var meta = TABS.filter(function (t) { return t.id === current; })[0];
      document.getElementById('appbar-title').textContent = meta.title;

      var st = Repo.state();
      document.getElementById('lvchip').textContent = 'Lv.' + st.level;

      var fab = document.getElementById('fab');
      fab.style.display = (current === 'home') ? 'none' : 'flex';
    },

    get currentTab() { return current; }
  };

  /* ---------------------------------------------------------------------
   * シェル
   * ------------------------------------------------------------------- */
  function renderShell() {
    var app = document.getElementById('app');
    UI.clear(app);

    var bar = UI.el('header', { class: 'appbar' }, [
      UI.el('h1', { id: 'appbar-title', text: ODL.APP_NAME }),
      UI.el('span', { class: 'lvchip', id: 'lvchip', text: 'Lv.1' })
    ]);

    var main = UI.el('main', { id: 'main' });

    var tabbar = UI.el('nav', { class: 'tabbar', id: 'tabbar' }, TABS.map(function (t) {
      return UI.el('button', {
        dataset: { tab: t.id },
        onclick: function () { App.go(t.id); }
      }, [
        UI.el('span', { class: 'ic', text: t.icon }),
        UI.el('span', { text: t.label })
      ]);
    }));

    var fab = UI.el('button', {
      class: 'fab', id: 'fab', text: '＋', 'aria-label': '記録する',
      onclick: function () { UI.openRecordSheet({}); }
    });

    app.appendChild(bar);
    app.appendChild(main);
    app.appendChild(fab);
    app.appendChild(tabbar);

    if (!document.getElementById('toast-host')) {
      document.body.appendChild(UI.el('div', { id: 'toast-host' }));
    }
    mounted = true;
  }

  /* ---------------------------------------------------------------------
   * 復旧画面（データが壊れている / migration失敗）
   *   ここでは絶対に自動で上書き・初期化しない。ユーザーが選ぶ。
   * ------------------------------------------------------------------- */
  function renderRecovery(status, kind) {
    var app = document.getElementById('app');
    UI.clear(app);
    if (!document.getElementById('toast-host')) {
      document.body.appendChild(UI.el('div', { id: 'toast-host' }));
    }

    var title = kind === 'corrupt'
      ? '保存データを読み込めませんでした'
      : 'データ形式の更新に失敗しました';
    var lead = kind === 'corrupt'
      ? '保存されているデータが壊れている可能性があります。念のため、元のデータには一切手を加えていません。'
      : '古い形式のデータを新しい形式へ変換できませんでした。元のデータはそのまま残してあります。';

    var box = UI.el('div', { class: 'boot-error' }, [
      UI.el('h2', { text: '⚠ ' + title }),
      UI.el('p', { text: lead }),
      UI.el('div', { class: 'note', text: '詳細: ' + (status.error || '不明') +
        (status.fromVersion !== undefined ? '（schemaVersion ' + status.fromVersion + ' → ' + status.toVersion + '）' : '') })
    ]);

    var backups = status.backups || Repo.listAutoBackups();
    if (backups.length) {
      box.appendChild(UI.el('div', { class: 'section-title', text: '自動バックアップから復元' }));
      box.appendChild(UI.el('div', { class: 'list' }, backups.map(function (b) {
        var obj = Repo.readAutoBackup(b.key);
        var count = obj && Array.isArray(obj.trainingRecords) ? obj.trainingRecords.length :
                    (obj && Array.isArray(obj.records) ? obj.records.length : '?');
        return UI.el('div', { class: 'row' }, [
          UI.el('div', { class: 'body' }, [
            UI.el('div', { class: 't', text: b.at.replace(/T/, ' ').slice(0, 19).replace(/-/g, '/') }),
            UI.el('div', { class: 's', text: '記録 ' + count + '件' })
          ]),
          UI.el('div', { class: 'end' }, [
            UI.el('button', {
              class: 'btn small primary', text: '復元', onclick: function () {
                var raw = ODL.Storage.readRaw(b.key);
                if (!raw) { UI.toast('バックアップを読み込めませんでした', 'err'); return; }
                /* まだ data が無い状態なので、まっさらから読み込む */
                Repo.quarantineAndStartFresh();
                var res = Repo.importFromString(raw, { allowEmpty: true });
                if (!res.ok) { UI.toast(res.errors[0], 'err', 5000); return; }
                renderShell(); App.go('home');
                UI.toast('復元しました', 'ok', 4000);
              }
            })
          ])
        ]);
      })));
    }

    box.appendChild(UI.el('div', { class: 'section-title', text: 'バックアップファイルから復元' }));
    box.appendChild(UI.el('button', {
      class: 'btn primary block', text: '⬆ JSONファイルを選んで復元',
      onclick: function () {
        var input = UI.el('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
        document.body.appendChild(input);
        input.addEventListener('change', function () {
          var file = input.files && input.files[0];
          document.body.removeChild(input);
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            Repo.quarantineAndStartFresh();
            var res = Repo.importFromString(String(reader.result), { allowEmpty: true });
            if (!res.ok) { UI.toast(res.errors[0], 'err', 5000); return; }
            renderShell(); App.go('home');
            UI.toast('復元しました', 'ok', 4000);
          };
          reader.onerror = function () { UI.toast('ファイルを読み込めませんでした', 'err'); };
          reader.readAsText(file);
        });
        input.click();
      }
    }));

    box.appendChild(UI.el('div', { class: 'section-title', text: 'それでも解決しない場合' }));
    box.appendChild(UI.el('div', { class: 'warnbox', text:
      '「新しく始める」を選ぶと、読み込めなかったデータは自動バックアップへ退避したうえで、空の状態からスタートします。退避したデータはブラウザのデータを消すまで残ります。' }));
    box.appendChild(UI.el('button', {
      class: 'btn danger block mt8', text: '新しく始める（退避してリセット）',
      onclick: function () {
        UI.confirm({
          title: '新しく始めますか？',
          message: '読み込めなかったデータを退避し、空の状態でアプリを開始します。',
          requireText: 'はじめる', okLabel: '実行する', danger: true
        }).then(function (ok) {
          if (!ok) return;
          Repo.quarantineAndStartFresh();
          renderShell(); App.go('home');
        });
      }
    }));

    app.appendChild(box);
  }

  /* ---------------------------------------------------------------------
   * PWA
   * ------------------------------------------------------------------- */
  function registerServiceWorker() {
    if (global.ODL_DISABLE_SW) return;   /* 単一HTML版ではSWを使わない */
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    try {
      navigator.serviceWorker.register('sw.js').catch(function () { /* オフライン機能なしでも動作する */ });
    } catch (e) { /* noop */ }
  }

  /* 起動 */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { App.boot(); });
  } else {
    App.boot();
  }

})(typeof window !== 'undefined' ? window : globalThis);

</script>

</body>
